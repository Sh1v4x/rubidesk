name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
          - platform: windows-latest

    runs-on: ${{ matrix.platform }}

    env:
      # whisper.cpp utilise std::filesystem, indisponible sous la cible 10.13 par défaut
      MACOSX_DEPLOYMENT_TARGET: "12.0"

    steps:
      - uses: actions/checkout@v4

      # bindgen (whisper-rs-sys) a besoin de libclang sur les runners Windows ;
      # sur macOS il la trouve seul — ne surtout pas définir la variable à vide.
      - name: Configurer libclang (Windows)
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: echo 'LIBCLANG_PATH=C:\Program Files\LLVM\bin' >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Rubidesk ${{ github.ref_name }}"
          releaseBody: |
            Packages compilés automatiquement par la CI.

            - **Windows** : `Rubidesk_x.y.z_x64-setup.exe`
            - **macOS** (Apple Silicon) : `Rubidesk_x.y.z_aarch64.dmg`

            Binaires non signés : voir le README pour la première ouverture.
          releaseDraft: false
          prerelease: false
